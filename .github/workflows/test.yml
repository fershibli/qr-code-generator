name: Test

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Build Storybook
        run: npm run build-storybook
